<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>语料标注与仲裁</title>
<style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f6f7f9}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#235347;color:#fff}pre{white-space:pre-wrap;max-height:360px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}</style>
<h1>语料标注与争议仲裁</h1><section><button onclick="load()">刷新状态</button><pre id="state"></pre></section>
<section><h2>待办与名额</h2><pre id="workload">加载中…</pre></section>
<section><h2>标注与讨论</h2><div class="grid"><input id="item" type="number" placeholder="条目 ID"><input id="user" type="number" placeholder="用户 ID"><input id="label" placeholder="标签"><textarea id="comment" placeholder="备注"></textarea><input id="batch" type="number" placeholder="批次 ID"><input id="manager" type="number" placeholder="管理员 ID"></div>
<button onclick="claim()">领取任务</button><button onclick="giveBack()">交回任务</button><button onclick="annotate()">提交标注</button><button onclick="loadItem()">查看条目与讨论可见性</button><button onclick="disagreements()">查看分歧</button><button onclick="consistency()">一致性</button><button onclick="freeze()">冻结金标准</button><pre id="result"></pre></section>
<section><h2>仲裁</h2><input id="arb" type="number" placeholder="仲裁员 ID"><input id="final" placeholder="最终标签"><input id="reason" placeholder="理由至少5字"><button onclick="adjudicate()">提交仲裁</button></section>
<script>const result=document.querySelector('#result');const show=x=>result.textContent=JSON.stringify(x,null,2);async function get(u){return show(await(await fetch(u)).json())}async function post(u,b){return show(await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
async function load(){const s=await(await fetch('/api/state')).json();document.querySelector('#state').textContent=JSON.stringify(s,null,2);
const users=s.users.map(u=>u.role==='annotator'?`${u.name}(#${u.id}) 待办 ${u.pending}/${s.limits.max_pending_per_annotator}`:`${u.name}(#${u.id}) ${u.role}`).join('\n');
const items=s.items.map(i=>`条目#${i.id}(批次${i.batch_id} 序号${i.ordinal}) 需${i.required_annotators}人 已领${i.active_assignments} 已交${i.submitted} 还缺${i.needed}人 排队${i.queued}`).join('\n');
const queue=s.queue.map(q=>`${q.annotator_name}(#${q.annotator_id}) 等待 条目#${q.item_id}`).join('\n')||'(空)';
document.querySelector('#workload').textContent='【每人待办】\n'+users+'\n\n【条目缺口】\n'+items+'\n\n【等待队列】\n'+queue}
function claim(){post('/api/batches/'+batch.value+'/assign',{item_id:+item.value,annotator_id:+user.value}).then(load)}function giveBack(){post('/api/items/'+item.value+'/return',{annotator_id:+user.value}).then(load)}
function annotate(){post('/api/annotations',{item_id:+item.value,annotator_id:+user.value,label:label.value,comment:comment.value}).then(load)}function loadItem(){get('/api/items/'+item.value+'?user_id='+user.value)}function disagreements(){get('/api/batches/'+batch.value+'/disagreements')}function consistency(){get('/api/batches/'+batch.value+'/consistency')}function adjudicate(){post('/api/adjudications',{item_id:+item.value,arbitrator_id:+arb.value,final_label:final.value,reason:reason.value})}function freeze(){post('/api/batches/'+batch.value+'/freeze',{manager_id:+manager.value})}load()</script>
</html>
